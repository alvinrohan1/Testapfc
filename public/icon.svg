<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Crest Shield -->
  <path d="M 256 80 L 384 136 C 384 272 256 368 256 368 C 256 368 128 272 128 136 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Checkmark / Test Quill -->
  <path d="M 192 232 L 236 276 L 328 184" 
        fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Stars -->
  <circle cx="210" cy="148" r="6" fill="#fbbf24" />
  <circle cx="256" cy="136" r="8" fill="#fbbf24" />
  <circle cx="302" cy="148" r="6" fill="#fbbf24" />

  <!-- Badge Text APFC -->
  <rect x="156" y="396" width="200" height="48" rx="24" fill="#0369a1" />
  <text x="256" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">APFC TEST</text>
</svg>
